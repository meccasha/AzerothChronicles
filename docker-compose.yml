# Local/full-stack environment. `docker compose up --build`, then open http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-azeroth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-azeroth}
      POSTGRES_DB: ${POSTGRES_DB:-azeroth}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-azeroth}"]
      interval: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-azeroth}:${POSTGRES_PASSWORD:-azeroth}@db:5432/${POSTGRES_DB:-azeroth}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 10

  # Periodic Battle.net sync + award recalculation (no Redis needed at this scale).
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-azeroth}:${POSTGRES_PASSWORD:-azeroth}@db:5432/${POSTGRES_DB:-azeroth}
      RUN_MIGRATIONS: "0"
    command: ["python", "-m", "app.cli", "worker"]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_ORIGIN: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
